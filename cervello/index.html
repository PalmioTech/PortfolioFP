<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Cervello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap">
<link rel="stylesheet" href="app.css"></head>
<body>
<header id="hdr"><h1>Cervello</h1><span class="sub">Le mie scadenze</span></header>
<main>
  <p id="status" role="status"></p>
  <section id="setup" hidden>
    <h2>Configura Google</h2>
    <p>Incolla il Client ID OAuth di Google per iniziare.</p>
    <input id="clientIdInput" type="text" placeholder="xxxx.apps.googleusercontent.com" autocomplete="off" aria-label="Client ID OAuth">
    <button id="btnSalva" class="btn-primary" type="button">Salva</button>
  </section>
  <section id="connectBar" hidden>
    <button id="btnConnetti" class="btn-primary" type="button">Connetti Google</button>
  </section>
  <div id="viewTabs" hidden role="tablist" aria-label="Vista scadenze">
    <button id="tabLista" class="vtab is-on" type="button">Lista</button>
    <button id="tabTimeline" class="vtab" type="button">Timeline</button>
  </div>
  <section id="list" hidden></section>
  <section id="timeline" hidden></section>
  <p id="empty" hidden>Nessuna scadenza. Tutto tranquillo.</p>
  <form id="form" hidden novalidate>
    <h2 id="fTitolo">Nuova scadenza</h2>
    <label>Categoria<select id="fCategoria"></select></label>
    <label>Nome<input id="fNome" type="text" required autocomplete="off"></label>
    <div class="row">
      <label>Data<input id="fData" type="date" required></label>
      <label>Ora (opz.)<input id="fOra" type="time"></label>
      <label>Avviso (giorni prima)<input id="fGiorniPrima" type="number" min="0" max="28" inputmode="numeric"><small>max 28 giorni, limite promemoria Google</small></label>
    </div>
    <div id="avvisaRow">
      <label>Avvisami (opz.)<input id="fAvvisa" type="datetime-local"><small>promemoria a un momento preciso — solo per scadenze non ricorrenti</small></label>
    </div>
    <label class="chk"><input id="fRicorrente" type="checkbox"> Si ripete ogni anno</label>
    <p id="fMsg" class="fmsg" role="alert"></p>
    <div class="actions">
      <button id="fSalva" class="btn-primary" type="submit">Salva</button>
      <button id="fNuova" class="btn-danger" type="button" hidden>Nuova</button>
      <button id="fElimina" class="btn-danger" type="button" hidden>Elimina</button>
    </div>
  </form>
</main>
<script src="config.js"></script>
<script src="model.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="gcal.js"></script>
<script src="app.js"></script>
</body></html>
