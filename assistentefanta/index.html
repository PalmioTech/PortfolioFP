<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente Fanta — Asta Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<main id="app">
  <header id="hdr">
    <div id="phase">—</div>
    <div id="mybudget">—</div>
    <div id="perslot">—</div>
  </header>
  <section id="cols">
    <aside id="roster"></aside>
    <div id="center">
      <div id="card"></div>
      <div id="advice"></div>
      <div id="saleflow"></div>
      <div id="queue"></div>
    </div>
    <aside id="rivals"></aside>
  </section>
  <footer id="controls">
    <button id="btnPrev" type="button">◀</button>
    <button id="btnNext" type="button">▶</button>
    <button id="btnUndo" type="button">Undo</button>
    <input id="search" type="search" placeholder="cerca…">
    <button id="btnExport" type="button">Export</button>
    <button id="btnImport" type="button">Import</button>
    <input id="fileImport" type="file" accept="application/json" hidden>
    <button id="btnConfig" type="button">⚙︎</button>
    <button id="btnAI" type="button">💬</button>
    <button id="btnReset" type="button">Reset</button>
  </footer>
  <div id="configPanel" hidden></div>
</main>
<div id="aiPanel" hidden>
  <div id="aiHead">
    <strong>Assistente AI</strong>
    <input id="aiKey" type="password" placeholder="API key OpenAI (opzionale)" autocomplete="off">
    <span id="aiMode"></span>
    <button id="aiClose" type="button">✕</button>
  </div>
  <div id="aiKeyNote">La key resta nel tuo browser (localStorage) e va solo a OpenAI. Vuota = modo copia-incolla con ChatGPT (consigliato: funziona sempre col tuo Plus). Il modo API automatico spesso è bloccato dal browser (CORS di OpenAI) da pagina statica: se fallisce, usa il copia-incolla.</div>
  <div id="aiMessages"></div>
  <div id="aiQuick">
    <button id="aiQuickValuta" type="button">Valuta il giocatore</button>
    <button id="aiQuickManca" type="button">Cosa mi manca</button>
    <button id="aiQuickMeglio" type="button">Meglio X o Y</button>
  </div>
  <div id="aiInputRow">
    <textarea id="aiInput" rows="2" placeholder="chiedi qualcosa sull'asta…"></textarea>
    <button id="aiSend" type="button">Invia</button>
  </div>
</div>
<script src="store.js"></script>
<script src="advisor.js"></script>
<script src="data/players.js"></script>
<script src="app.js"></script>
<script src="ai.js"></script>
</body>
</html>
